<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BearBearCalc is a friendly ice bear-themed calculator for unit conversions, income tax, payroll, and more."
    />
    <link rel="icon" type="image/png" href="public/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>BearBearCalc</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="public/bearbearcalc-logo.png" alt="BearBearCalc ice bear face" />
          <div><strong>BearBearCalc</strong><span>ICE BEAR CALCULATOR</span></div>
        </div>
        <p class="nav-label">Tools</p>
        <nav aria-label="Calculator tools">
          <button class="active" data-tool="conversion" type="button">
            <span class="nav-icon" aria-hidden="true"><svg fill="none" height="18" viewBox="0 0 24 24" width="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M4 7h14m0 0-3-3m3 3-3 3M20 17H6m0 0 3 3m-3-3 3-3"/></svg></span>
            <span>Unit conversion</span>
          </button>
          <button data-tool="tax" type="button">
            <span class="nav-icon" aria-hidden="true"><svg fill="none" height="18" viewBox="0 0 24 24" width="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M6 3v18l3-2 3 2 3-2 3 2V3l-3 2-3-2-3 2-3-2Z"/><path d="M9 9h6M9 13h6"/></svg></span>
            <span>Income tax</span>
          </button>
          <button data-tool="loops" type="button">
            <span class="nav-icon" aria-hidden="true"><svg fill="none" height="18" viewBox="0 0 24 24" width="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M17.7 6.3A8 8 0 1 0 20 12"/><path d="M17 2v5h5"/></svg></span>
            <span>Natural numbers</span>
          </button>
          <button data-tool="payroll" type="button">
            <span class="nav-icon" aria-hidden="true"><svg fill="none" height="18" viewBox="0 0 24 24" width="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/></svg></span>
            <span>Simple payroll</span>
          </button>
          <button data-tool="history" type="button">
            <span class="nav-icon" aria-hidden="true"><svg fill="none" height="18" viewBox="0 0 24 24" width="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></span>
            <span>Calculation history</span>
          </button>
          <button data-tool="about" type="button">
            <span class="nav-icon" aria-hidden="true"><svg fill="none" height="18" viewBox="0 0 24 24" width="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span>
            <span>About me</span>
          </button>
        </nav>
      </aside>
      <button aria-label="Close menu" class="backdrop" data-action="close-menu" hidden type="button"></button>
      <div class="main-area">
        <header class="topbar">
          <button aria-label="Open menu" class="menu-button" data-action="open-menu" type="button"><svg aria-hidden="true" fill="none" height="18" viewBox="0 0 24 24" width="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="breadcrumb"><strong data-current-tool>Unit conversion</strong></div>
          <div class="status"><span></span>All calculations run locally</div>
        </header>
        <main id="app"></main>
      </div>
      <nav class="mobile-nav" aria-label="Calculator tools">
        <button class="active" data-tool="conversion" type="button"><span>Convert</span></button>
        <button data-tool="tax" type="button"><span>Tax</span></button>
        <button data-tool="loops" type="button"><span>Loops</span></button>
        <button data-tool="payroll" type="button"><span>Payroll</span></button>
        <button data-tool="history" type="button"><span>History</span></button>
        <button data-tool="about" type="button"><span>About</span></button>
      </nav>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
